server {
  listen 80;
  root /usr/share/nginx/html;

  # Uploads are capped at 20 MB by the API.
  client_max_body_size 25m;

  # Docker's DNS, so nginx starts even while the api/minio containers are still booting.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3001;
  set $storage http://minio:9000;

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /socket.io/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  # Presigned download links (S3_PUBLIC_ENDPOINT) are signed for this host,
  # so the Host header must reach MinIO unchanged.
  location /algo-quant/ {
    proxy_pass $storage;
    proxy_set_header Host $host;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
