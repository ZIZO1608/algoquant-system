# Production stack for Coolify (Docker Compose build pack).
# In Coolify, give the `web` service the domain https://algoquant.ahmad-zaven.io
# SERVICE_USER_* / SERVICE_PASSWORD_* values are generated by Coolify on first deploy
# and shown under Environment Variables.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3001
      TRUST_PROXY_HOPS: 2
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/algo_quant?schema=public
      APP_URL: ${APP_URL:-https://algoquant.ahmad-zaven.io}
      CORS_ORIGIN: ${APP_URL:-https://algoquant.ahmad-zaven.io}
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      JWT_REFRESH_SECRET: ${SERVICE_PASSWORD_64_JWTREFRESH}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      WEBHOOK_DEFAULT_SECRET: ${SERVICE_PASSWORD_64_WEBHOOK}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@algoquant.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      SEED_DEMO: ${SEED_DEMO:-true}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${APP_URL:-https://algoquant.ahmad-zaven.io}
      S3_REGION: us-east-1
      S3_BUCKET: algo-quant
      S3_ACCESS_KEY: ${SERVICE_USER_MINIO}
      S3_SECRET_KEY: ${SERVICE_PASSWORD_MINIO}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: algo_quant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d algo_quant"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
