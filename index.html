<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Algo Quant — نظام إدارة الأكاديمية: العملاء، الدورات، الطلاب، المهام، والمالية." />
    <meta name="theme-color" content="#26abfb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1219" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="Algo Quant" />
    <meta name="apple-mobile-web-app-title" content="Algo Quant" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Algo Quant — لوحة الإدارة</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var t = localStorage.getItem('algo_theme');
          if (t === 'dark' || t === 'light') root.setAttribute('data-theme', t);
          if (localStorage.getItem('algo_lang') === 'en') {
            root.setAttribute('lang', 'en');
            root.setAttribute('dir', 'ltr');
            document.title = 'Algo Quant — Admin Panel';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
